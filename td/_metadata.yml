# Réglages communs aux pages de TD (sujets et corrigés)
body-classes: wp-td
# Sortie PDF (Typst), gabarit Working Paper : assets/typst/ (même bloc dans cours/_metadata.yml)
format:
  html:
    format-links:   # « html » seul masque les liens par défaut (« Typst »)
      - html
      - format: typst
        text: "Télécharger le PDF"
        icon: file-pdf
  typst:
    template-partials: [../assets/typst/typst-template.typ, ../assets/typst/typst-show.typ]
    filters: [../assets/typst/wp-typst.lua]
    font-paths: [../assets/fonts]
